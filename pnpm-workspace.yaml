nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
allowBuilds:
  'esbuild': true
overrides:
  '@react-native/babel-preset': '0.86.3'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'react-native-screens': '4.30.0'
# No patchedDependencies carried over: Bluesky's patches target their
# native modules, Sentry and EAS setup, none of which we vendor (see
# docs/DECISIONS.md). Re-evaluate per slice if a patch-worthy issue appears.
